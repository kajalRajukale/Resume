- name: ai_worksheet_generator
  title: Lessonleaf – AI Worksheet Generator
  pitch: Flask app that drafts, edits and prints classroom worksheets with Google Gemini.
  problem: Writing worksheets for different grades, topics and languages takes teachers a lot of time,
    and raw chatbot output is hard to edit, store and print.
  approach: Gemini returns structured JSON that the server validates before saving. Worksheets live in
    a searchable SQLite library, keep their original prompt for "create similar", and export as separate
    student and teacher PDFs (fpdf2 + HarfBuzz shaping for Hindi and Marathi).
  features:
  - Worksheet requests for subject, grade, topic, difficulty, question count, question types, language,
    and instructions.
  - Structured AI output validated on the server. Missing credentials and provider errors are reported;
    there are no fake sample questions.
  - SQLite-backed worksheet library with search by title, subject, class, and topic; worksheets remain
    available after restarting the app.
  - Open saved worksheets, edit worksheet text and answers, add or remove questions, and save changes
    to SQLite.
  - Original generation settings, AI prompt, and system instruction are stored with each generated worksheet.
    Use Create similar to reload those settings into the f
  - Separate student and teacher PDF downloads.
  - Hindi and Marathi PDF text shaping when a Devanagari TrueType font is available.
  - No accounts or cloud sync; this local version stores worksheets on the computer running the app.
  stack:
  - Flask
  - Google Gemini
  - PDF export
  - SQLite
  - unittest
  models:
  - Google Gemini
  datasets: []
  results: 19 automated unittest tests cover request validation, the Gemini response parser, the Flask
    app and PDF export.
  how_to_run: 'py -3.12 -m venv .venv

    .\.venv\Scripts\python.exe -m pip install --upgrade pip

    .\.venv\Scripts\python.exe -m pip install -r requirements.txt

    Copy-Item .env.example .env

    notepad .env

    .\.venv\Scripts\python.exe app.py'
