<header class="nav">
  <a class="brand" href="{{ '/' | relative_url }}"><span class="prompt">~/</span>kajal<span class="caret">_</span></a>
  <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu"><span></span><span></span><span></span></button>
  <nav id="site-nav">
    {% for l in site.data.navigation %}
    {% assign active = false %}
    {% if page.url == l.url %}{% assign active = true %}{% elsif l.url != "/" and page.url contains l.url %}{% assign active = true %}{% endif %}
    <a href="{{ l.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ l.title }}</a>
    {% endfor %}
    <button class="theme-btn" type="button" aria-label="Toggle dark / light mode"><span class="sun">☀</span><span class="moon">☾</span></button>
  </nav>
</header>
